name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -ExecutionPolicy Bypass -File desktop\build.ps1
      # The app's update banner shows these lines as "What's new".
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notes = @(); $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { if ($inside) { break }; $inside = $line.Trim() -eq "## $version"; continue }
            if ($inside) { $notes += $line }
          }
          Set-Content -Path release-notes.md -Value (($notes -join "`n").Trim()) -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/SellerDeskSetup.exe
          body_path: release-notes.md
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t "$image:latest" -t "$image:${GITHUB_REF_NAME#v}" .
          docker push --all-tags "$image"
