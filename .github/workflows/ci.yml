name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t siren-ci .
      - run: docker run --rm siren-ci python -m siren --version

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -ExecutionPolicy Bypass -File desktop\build.ps1
      - run: powershell -ExecutionPolicy Bypass -File desktop\smoke.ps1
        timeout-minutes: 3
