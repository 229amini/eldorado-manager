[project]
name = "sellerdesk"
description = "Order alarms for Eldorado.gg sellers: phone, watch, desktop and a live dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = []

[project.scripts]
sellerdesk = "sellerdesk.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sellerdesk"]

[tool.setuptools.dynamic]
version = { attr = "sellerdesk.__version__" }

[tool.setuptools.package-data]
sellerdesk = ["static/*"]
